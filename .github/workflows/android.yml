name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: mkdir -p www && cp index.html www/index.html
      - run: npm init -y
      - run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - run: npx cap init TaxSnapAI com.taxsnap.ai --web-dir=www
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: TaxSnap-APK, path: android/app/build/outputs/apk/debug/app-debug.apk }
